name: Release
on:
  push:
    branches: [main]
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: "pnpm"
      - run: pnpm dlx semantic-release
      - name: Sync package.json version to released tag
        run: |
          version="$(git describe --tags --abbrev=0 --match 'v*')"
          version="${version#v}"
          # Compare against the COMMITTED manifest, not the workspace file:
          # @semantic-release/npm's prepare already rewrote the workspace
          # package.json to the new version (npm version --no-git-tag-version),
          # so reading it would always look "in sync" and never commit the bump.
          current="$(git show HEAD:package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
          if [ "$current" = "$version" ]; then
            echo "package.json already at ${version} in HEAD — nothing to sync"
            exit 0
          fi
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.argv[1];fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')" "$version"
          git add package.json
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(release): sync package.json to v${version} [skip ci]"
          # semantic-release tags the pre-bump commit, so the tag's tree would
          # carry the stale manifest. Point the tag at the sync commit so a
          # checkout of the tag sees the released version. (The GitHub Release
          # keeps its original target commit — cosmetic only.)
          git tag -f "v${version}" HEAD
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/v${version}"
